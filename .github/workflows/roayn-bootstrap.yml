name: Apply verified ROAYN website

on:
  push:
    branches:
      - copilot/roayn-corporate-site
    paths:
      - .github/workflows/roayn-bootstrap.yml

permissions:
  contents: write

jobs:
  apply-website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the target branch
        uses: actions/checkout@v6
        with:
          ref: copilot/roayn-corporate-site

      - name: Verify the exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "appofun/roayn"
          test "$GITHUB_REF_NAME" = "copilot/roayn-corporate-site"

      - name: Apply the locally tested source archive
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .
          git clean -fdx
          base64 --decode > /tmp/roayn-site.tar.gz <<'ROAYN_PAYLOAD'

ROAYN_PAYLOAD
          tar -xzf /tmp/roayn-site.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/roayn-bootstrap.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build premium ROAYN corporate website"
          git push origin HEAD:copilot/roayn-corporate-site
